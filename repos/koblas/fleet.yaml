# koblas/fleet: Flux GitOps config for the nsc2108 k3s box. The file's
# path names the repo.
enabled: true                 # kill switch for this repo
shadow: true                  # first run: review and store, post nothing
review_drafts: true
forks:
  review: false
# Generated by flux bootstrap, and what the whole cluster syncs from.
sensitive_paths: ["clusters/*/flux-system/**"]
approval_mode: native_approve # set per ruleset from `exemplar sandbox probe-approval`
